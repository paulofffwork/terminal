<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS // secure terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #040704;
    --bg-panel: #0a0f0a;
    --bg-bar: #0d140d;
    --fg: #3dff7a;
    --fg-glow: rgba(61,255,122,0.55);
    --fg-dim: #2e6b45;
    --fg-faint: #1b4a2c;
    --amber: #ffb020;
    --red: #ff4d4d;
    --border: #123018;
  }
  *{ box-sizing: border-box; }
  html,body{
    height:100%; margin:0;
    background: var(--bg);
    font-family: 'JetBrains Mono', ui-monospace, 'Fira Code', monospace;
    color: var(--fg);
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding: 24px;
    overflow:hidden;
  }
  .crt{
    position:relative;
    width:100%; max-width: 940px;
    height: 86vh; max-height: 720px;
    animation: flicker 7s infinite;
  }
  @keyframes flicker{
    0%,100%{ filter:brightness(1); }
    92%{ filter:brightness(1); }
    93%{ filter:brightness(0.96); }
    94%{ filter:brightness(1.02); }
    95%{ filter:brightness(0.98); }
    96%{ filter:brightness(1); }
  }
  .terminal-window{
    position:relative;
    width:100%; height:100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 60px rgba(61,255,122,0.12), 0 30px 60px rgba(0,0,0,0.6);
    display:flex; flex-direction:column;
    overflow:hidden;
    transition: opacity 1.4s ease, filter 1.4s ease;
  }
  .terminal-window.ending{
    opacity:0; filter: blur(6px) brightness(0.2);
  }
  .title-bar{
    display:flex; align-items:center; gap:10px;
    padding: 10px 14px;
    background: var(--bg-bar);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--fg-dim);
    user-select:none;
  }
  .dots{ display:flex; gap:6px; }
  .dots span{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .dots span:nth-child(1){ background:#ff5f56; }
  .dots span:nth-child(2){ background:#ffbd2e; }
  .dots span:nth-child(3){ background:#27c93f; }
  .title-text{ flex:1; text-align:center; letter-spacing:0.5px; }
  .status{ font-size:11px; color: var(--red); letter-spacing:0.5px; }
  .status.online{ color: var(--fg); text-shadow: 0 0 6px var(--fg-glow); }

  .screen{
    flex:1; padding: 18px 20px 14px;
    overflow-y:auto;
    font-size: 14.5px; line-height: 1.55;
    text-shadow: 0 0 6px var(--fg-glow);
  }
  .screen::-webkit-scrollbar{ width:10px; }
  .screen::-webkit-scrollbar-thumb{ background: var(--fg-faint); border-radius:6px; }
  .screen::-webkit-scrollbar-track{ background: transparent; }

  #output div{ white-space: pre-wrap; word-break: break-word; margin: 0 0 2px; }
  .line-cmd{ color: #cfffe0; }
  .line-cmd .p{ color: var(--fg); }
  .line-dim{ color: var(--fg-dim); }
  .line-amber{ color: var(--amber); }
  .line-red{ color: var(--red); }
  .line-bright{ color: #b9ffcf; font-weight:700; }
  .line-blank{ height: 6px; }

  .input-line{
    display:flex; align-items:center; gap:8px;
    margin-top: 4px;
  }
  .prompt{ color: var(--fg); white-space:nowrap; flex-shrink:0; }
  #cmdInput{
    flex:1;
    background: transparent;
    border: none; outline: none;
    color: #eaffef;
    font-family: inherit; font-size: inherit;
    text-shadow: 0 0 6px var(--fg-glow);
    caret-color: var(--fg);
  }

  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.22) 2px,
      rgba(0,0,0,0) 3px
    );
    border-radius: 10px;
    mix-blend-mode: multiply;
    opacity:0.6;
  }
  .vignette{
    position:absolute; inset:0; pointer-events:none; z-index:6;
    border-radius:10px;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.75);
  }

  #matrixCanvas{
    position:fixed; inset:0; z-index:50;
    display:none;
  }

  .reconnect{
    position:fixed; inset:0; z-index:60;
    display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    color: var(--fg); font-family:'JetBrains Mono', monospace;
    text-shadow: 0 0 10px var(--fg-glow);
    letter-spacing: 1px;
    cursor:pointer;
  }
  .reconnect .big{ font-size:20px; }
  .reconnect .small{ font-size:12px; color: var(--fg-dim); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:0.15; } }

  @media (max-width: 640px){
    body{ padding: 10px; }
    .crt{ height: 92vh; }
    .screen{ font-size: 13px; }
    .title-text{ font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce){
    .crt{ animation:none; }
    .reconnect .small{ animation:none; }
  }
</style>
</head>
<body>

  <div class="crt">
    <div class="terminal-window" id="termWindow">
      <div class="title-bar">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="title-text">guest@nexus-mainframe — secure shell</div>
        <div class="status" id="statusIndicator">● CONNECTING</div>
      </div>
      <div class="screen" id="screen">
        <div id="output"></div>
        <div class="input-line" id="inputLine" style="visibility:hidden;">
          <span class="prompt" id="promptLabel">guest@nexus:~$</span>
          <input id="cmdInput" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </div>
      </div>
    </div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <canvas id="matrixCanvas"></canvas>
  <div class="reconnect" id="reconnectOverlay">
    <div class="big">CONNECTION TERMINATED BY HOST</div>
    <div class="small">[ press any key to reconnect ]</div>
  </div>

<script>
(function(){
  const output = document.getElementById('output');
  const screen = document.getElementById('screen');
  const input = document.getElementById('cmdInput');
  const inputLine = document.getElementById('inputLine');
  const promptLabel = document.getElementById('promptLabel');
  const statusIndicator = document.getElementById('statusIndicator');
  const termWindow = document.getElementById('termWindow');
  const reconnectOverlay = document.getElementById('reconnectOverlay');

  const state = {
    history: [],
    historyIndex: 0,
    exploited: false,
    password: null,
    gameWon: false,
    busy: false
  };

  const CORRECT_HEX = '4e455855532d373737'; // hex for NEXUS-777
  const CORRECT_PASS = 'NEXUS-777';

  const KNOWN_COMMANDS = ['help','scan','users','ls','dir','cat','exploit','logs','decrypt',
    'access database','whoami','clear','history','sudo','matrix','coffee','hack nasa',
    'rm -rf /','connect','ping','uname','date','credits','exit','logout'];

  function scrollDown(){ screen.scrollTop = screen.scrollHeight; }

  function addLine(text, cls){
    const div = document.createElement('div');
    if(cls) div.className = cls;
    div.textContent = text;
    output.appendChild(div);
    scrollDown();
    return div;
  }

  function addBlank(){
    const div = document.createElement('div');
    div.className = 'line-blank';
    output.appendChild(div);
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function typeLine(text, cls, speed){
    speed = speed === undefined ? 10 : speed;
    const div = document.createElement('div');
    if(cls) div.className = cls;
    output.appendChild(div);
    for(let i=0;i<text.length;i++){
      div.textContent += text[i];
      if(i % 2 === 0) scrollDown();
      await sleep(speed);
    }
    scrollDown();
  }

  async function typeSequence(lines, speed){
    for(const item of lines){
      if(item === null){ addBlank(); continue; }
      const [text, cls] = Array.isArray(item) ? item : [item, null];
      await typeLine(text, cls, speed);
    }
  }

  function printSequence(lines){
    for(const item of lines){
      if(item === null){ addBlank(); continue; }
      const [text, cls] = Array.isArray(item) ? item : [item, null];
      addLine(text, cls);
    }
  }

  function setBusy(v){
    state.busy = v;
    input.disabled = v;
  }

  // ---------- BOOT SEQUENCE ----------
  const banner = [
    '   ╔══════════════════════════════════════════════╗',
    '   ║      N E X U S   M A I N F R A M E  v4.2.1     ║',
    '   ╚══════════════════════════════════════════════╝'
  ];

  async function boot(){
    setBusy(true);
    await typeSequence([
      ['BIOS v2.14.221 — NEXUS SECURE TERMINAL', 'line-dim'],
      ['Initializing kernel modules............. [OK]', 'line-dim'],
      ['Mounting encrypted volumes................ [OK]', 'line-dim'],
      ['Establishing uplink to NEXUS-CORP mainframe.. [OK]', 'line-dim'],
      ['Bypassing intrusion detection............. [OK]', 'line-dim'],
      null,
      ['WARNING: unauthorized access will be logged.', 'line-amber'],
    ], 6);
    addBlank();
    printSequence(banner.map(l => [l, 'line-bright']));
    addBlank();
    await typeSequence([
      ['SYSTEM ONLINE', 'line-bright'],
      ['USER: GUEST', 'line-dim'],
      null,
      ["Type 'help' to list available commands.", 'line-dim'],
      null,
    ], 8);
    statusIndicator.textContent = '● ONLINE';
    statusIndicator.classList.add('online');
    inputLine.style.visibility = 'visible';
    setBusy(false);
    input.focus();
  }

  // ---------- COMMAND HANDLERS ----------

  function help(){
    printSequence([
      ['AVAILABLE COMMANDS', 'line-bright'],
      null,
      ['  RECON', 'line-amber'],
      ['    scan                    probe the local network for vulnerabilities'],
      ['    users                   list known accounts on this system'],
      ['    ls / dir                list files in the current directory'],
      ['    cat <file>              print the contents of a file'],
      null,
      ['  EXPLOIT', 'line-amber'],
      ['    exploit <n>             attempt to exploit vulnerability #n'],
      ['    logs                    read the system access log (needs a foothold)'],
      ['    decrypt <cipher>        decrypt a hex-encoded string'],
      ['    access database <pass>  authenticate against the vault'],
      null,
      ['  SYSTEM', 'line-amber'],
      ['    whoami, history, clear, date, uname, ping, connect <ip>'],
      null,
      ['  MISC', 'line-amber'],
      ['    coffee, credits, exit'],
      null,
    ]);
  }

  async function scan(){
    await typeSequence([
      ['Scanning network topology...', 'line-dim'],
      ['Probing 254 hosts on subnet 10.13.37.0/24...', 'line-dim'],
    ], 6);
    printSequence([
      ['3 vulnerabilities detected:', 'line-bright'],
      ['  [1] CVE-2023-4471  — outdated SSH daemon (port 22)'],
      ['  [2] weak credential policy — admin panel (port 8080)'],
      ['  [3] unpatched firmware — backup_svc daemon (port 21)'],
      null,
      ["Use 'exploit <number>' to attempt access.", 'line-dim'],
      null,
    ]);
  }

  function users(){
    printSequence([
      ['Querying user directory...', 'line-dim'],
      null,
      ['USERNAME     ROLE           LAST LOGIN', 'line-bright'],
      ['guest        visitor        —'],
      ['admin        administrator  2024-11-02 03:14'],
      ['root         superuser      [ACCESS RESTRICTED]', 'line-red'],
      ['backup_svc   service acct   2024-11-02 03:15'],
      null,
    ]);
  }

  async function exploit(nStr){
    if(!nStr){
      addLine('Usage: exploit <vulnerability number>', 'line-dim');
      return;
    }
    const n = parseInt(nStr, 10);
    if(n === 1){
      await typeLine('Attempting SSH exploit on port 22...', 'line-dim', 6);
      addLine('Connection reset by peer.', 'line-dim');
      addLine('ACCESS DENIED', 'line-red');
    } else if(n === 2){
      await typeLine('Attempting credential brute force on admin panel...', 'line-dim', 6);
      addLine('3 attempts remaining. Panel temporarily locked.', 'line-dim');
      addLine('ACCESS DENIED', 'line-red');
    } else if(n === 3){
      await typeLine('Attempting FTP exploit on backup_svc (port 21)...', 'line-dim', 6);
      await typeLine('Buffer overflow triggered... shell spawned.', 'line-dim', 6);
      addLine('ACCESS GRANTED — shell running as backup_svc', 'line-bright');
      addBlank();
      addLine("New files readable: access.log, vault.enc", 'line-dim');
      addLine("Try 'ls' or 'logs'.", 'line-dim');
      state.exploited = true;
      promptLabel.textContent = 'backup_svc@nexus:~$';
    } else {
      addLine('No such vulnerability. Run \'scan\' first.', 'line-dim');
    }
  }

  function ls(){
    if(state.exploited){
      printSequence([
        ['README.txt   security.cfg   access.log   vault.enc'],
      ]);
    } else {
      printSequence([
        ['README.txt   security.cfg'],
      ]);
    }
  }

  function cat(file){
    if(!file){
      addLine('Usage: cat <file>', 'line-dim');
      return;
    }
    const name = file.toLowerCase();
    if(name === 'readme.txt'){
      printSequence([
        ['NEXUS CORP — INTERNAL R&D DIVISION', 'line-bright'],
        ["This mainframe coordinates NEXUS Corp's classified research"],
        ['programs. Unauthorized access is a violation of federal law'],
        ['and several laws that have not been invented yet.'],
        null,
        ['Any similarity to a real company is coincidental. Probably.', 'line-dim'],
        null,
      ]);
    } else if(name === 'security.cfg'){
      printSequence([
        ['firewall=enabled'],
        ['intrusion_detection=active'],
        ['admin_password_hash=**********'],
        ['backup_key_rotation=daily'],
        null,
      ]);
    } else if(name === 'access.log'){
      if(!state.exploited){
        addLine('Permission denied. Root privileges required.', 'line-red');
      } else {
        logs();
      }
    } else if(name === 'vault.enc'){
      if(!state.exploited){
        addLine('Permission denied.', 'line-red');
      } else {
        printSequence([
          ['[binary data — file is encrypted]', 'line-dim'],
          ["Use 'access database <password>' to attempt authentication.", 'line-dim'],
          null,
        ]);
      }
    } else {
      addLine("cat: '" + file + "': No such file", 'line-dim');
    }
  }

  function logs(){
    if(!state.exploited){
      addLine('Permission denied. Root privileges required — try exploiting a vulnerability first.', 'line-red');
      return;
    }
    printSequence([
      ['03:12:01  login attempt: admin  FAILED', 'line-dim'],
      ['03:12:45  login attempt: admin  FAILED', 'line-dim'],
      ['03:13:02  backup_svc cron job executed', 'line-dim'],
      ['03:14:56  root@nexus: password rotated', 'line-dim'],
      ['03:15:00  [ENCRYPTED] ' + CORRECT_HEX, 'line-amber'],
      null,
      ["Line flagged [ENCRYPTED]. Try 'decrypt <string>'.", 'line-dim'],
      null,
    ]);
  }

  function hexToAscii(hex){
    hex = hex.replace(/\s+/g, '');
    if(hex.length % 2 !== 0 || !/^[0-9a-fA-F]+$/.test(hex)) return null;
    let out = '';
    for(let i=0;i<hex.length;i+=2){
      out += String.fromCharCode(parseInt(hex.substr(i,2), 16));
    }
    return out;
  }

  async function decrypt(cipher){
    if(!cipher){
      addLine('Usage: decrypt <ciphertext>', 'line-dim');
      return;
    }
    await typeLine('Decrypting... cipher: HEX', 'line-dim', 6);
    const plain = hexToAscii(cipher);
    if(plain === null){
      addLine('Decryption failed. Invalid cipher block.', 'line-red');
      return;
    }
    addLine('Plaintext: ' + plain, 'line-bright');
    if(cipher.replace(/\s+/g,'').toLowerCase() === CORRECT_HEX){
      state.password = plain;
      addLine('Possible credential for database access.', 'line-dim');
    }
    addBlank();
  }

  async function accessDatabase(argParts){
    if(!argParts[0] || argParts[0].toLowerCase() !== 'database'){
      addLine('Usage: access database <password>', 'line-dim');
      return;
    }
    if(!state.exploited){
      addLine('ACCESS DENIED. Database endpoint unreachable — pivot through a compromised host first.', 'line-red');
      return;
    }
    const pass = argParts.slice(1).join(' ');
    if(!pass){
      addLine('Usage: access database <password>', 'line-dim');
      addLine('Hint: check the access log for encrypted credentials.', 'line-dim');
      return;
    }
    await typeLine('Authenticating against vault...', 'line-dim', 6);
    if(pass.toUpperCase() === CORRECT_PASS){
      addLine('ACCESS GRANTED', 'line-bright');
      addBlank();
      await typeSequence([
        ['   ╔════════════════════════════╗', 'line-bright'],
        ['   ║       VAULT  UNLOCKED       ║', 'line-bright'],
        ['   ╚════════════════════════════╝', 'line-bright'],
        null,
        ['FINAL LOG ENTRY — 03:16:02', 'line-amber'],
        ['"If you are reading this, the experiment worked."'],
        ['"Subject retained full cognitive function post-transfer."'],
        ['"Close the vault. Let them think it was just a terminal."'],
        ['   — Dr. R. Voss, NEXUS R&D', 'line-dim'],
        null,
        ["Try 'whoami' now.", 'line-dim'],
        null,
      ], 8);
      state.gameWon = true;
      promptLabel.textContent = 'root@nexus:~#';
    } else {
      addLine('ACCESS DENIED. Incorrect credentials logged.', 'line-red');
    }
  }

  function whoami(){
    if(state.gameWon){
      printSequence([
        ['SUBJECT-0', 'line-bright'],
        ['...the last active instance of Project NEXUS.'],
        ['Welcome back online.', 'line-dim'],
        null,
      ]);
    } else if(state.exploited){
      addLine('backup_svc (service account — limited shell)', 'line-dim');
    } else {
      addLine('guest (unauthorized session — read-only)', 'line-dim');
    }
  }

  function clearScreen(){
    output.innerHTML = '';
  }

  function historyCmd(){
    if(state.history.length === 0){
      addLine('No commands yet.', 'line-dim');
      return;
    }
    state.history.forEach((h, i) => addLine('  ' + (i+1) + '  ' + h, 'line-dim'));
  }

  function sudo(){
    printSequence([
      ["guest is not in the sudoers file.", 'line-dim'],
      ['This incident will be reported.', 'line-red'],
    ]);
  }

  function coffee(){
    printSequence([
      ["     ( (", 'line-dim'],
      ["      ) )", 'line-dim'],
      ["   .........", 'line-dim'],
      ["   |       |]", 'line-dim'],
      ["   \\       /", 'line-dim'],
      ["    `-----'", 'line-dim'],
      null,
      ['Coffee dispensed. Productivity +10%.', 'line-bright'],
      null,
    ]);
  }

  function hackNasa(){
    printSequence([
      ["Nice try.", 'line-dim'],
      ["NASA's firewall laughs at you.", 'line-dim'],
      ['Request redirected to /dev/null.', 'line-red'],
      null,
    ]);
  }

  function rmrf(){
    printSequence([
      ['Nice try — this filesystem is immutable.', 'line-dim'],
      ['Nothing was deleted. Probably.', 'line-dim'],
      null,
    ]);
  }

  function connect(ip){
    if(!ip){ addLine('Usage: connect <ip address>', 'line-dim'); return; }
    printSequence([
      ['Connecting to ' + ip + '...', 'line-dim'],
      ['Connection timed out. Host unreachable.', 'line-red'],
      null,
    ]);
  }

  function ping(){
    printSequence([
      ['Pinging nexus-corp.local [10.13.37.1]...', 'line-dim'],
      ['Reply received in 12ms.', 'line-dim'],
      null,
    ]);
  }

  function uname(){
    addLine('NEXUS-OS 4.2.1 x86_64 (fake-kernel)', 'line-dim');
  }

  function dateCmd(){
    addLine(new Date().toString(), 'line-dim');
  }

  function credits(){
    printSequence([
      ['NEXUS TERMINAL SIMULATOR', 'line-bright'],
      ['A harmless make-believe hacking game.'],
      ['No real systems were harmed in the making of this terminal.', 'line-dim'],
      null,
    ]);
  }

  async function exitSession(){
    await typeLine('Closing secure shell...', 'line-dim', 10);
    await typeLine('Connection terminated by host.', 'line-red', 10);
    await sleep(600);
    termWindow.classList.add('ending');
    await sleep(1200);
    document.querySelector('.crt').style.display = 'none';
    reconnectOverlay.style.display = 'flex';
    const reconnect = () => location.reload();
    window.addEventListener('keydown', reconnect, { once:true });
    reconnectOverlay.addEventListener('click', reconnect, { once:true });
  }

  function unknown(cmd){
    addLine("'" + cmd + "': command not found. Type 'help' for a list of available commands.", 'line-dim');
  }

  // ---------- MATRIX EASTER EGG ----------
  function matrixRain(){
    const canvas = document.getElementById('matrixCanvas');
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = 'アイウエオカキクケコサシスセソ0123456789NEXUS';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = new Array(columns).fill(1);
    const rainSpeed = 80; // ms between frames — raise this to slow it down further
    let intervalId = null;

    function draw(){
      ctx.fillStyle = 'rgba(4,7,4,0.12)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#3dff7a';
      ctx.font = fontSize + 'px monospace';
      for(let i=0;i<drops.length;i++){
        const text = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    function stopMatrix(){
      clearInterval(intervalId);
      canvas.style.display = 'none';
      ctx.clearRect(0,0,canvas.width,canvas.height);
      input.focus();
      window.removeEventListener('keydown', stopMatrix);
    }

    intervalId = setInterval(draw, rainSpeed);
    // Deferred so the Enter keypress that triggered this command
    // (still bubbling up to window) doesn't instantly stop it.
    setTimeout(() => window.addEventListener('keydown', stopMatrix), 0);
  }

  // ---------- COMMAND ROUTER ----------
  async function runCommand(raw){
    const trimmed = raw.trim();
    if(trimmed === '') return;

    state.history.push(trimmed);
    state.historyIndex = state.history.length;

    const echo = document.createElement('div');
    echo.className = 'line-cmd';
    echo.innerHTML = '<span class="p">' + escapeHtml(promptLabel.textContent) + '</span> ' + escapeHtml(trimmed);
    output.appendChild(echo);
    scrollDown();

    const parts = trimmed.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const full = trimmed.toLowerCase();
    const args = parts.slice(1);

    setBusy(true);
    try{
      if(full === 'help' || full === 'man'){ help(); }
      else if(full === 'scan'){ await scan(); }
      else if(full === 'users'){ users(); }
      else if(cmd === 'ls' || cmd === 'dir'){ ls(); }
      else if(cmd === 'cat'){ cat(args[0]); }
      else if(cmd === 'exploit'){ await exploit(args[0]); }
      else if(full === 'logs'){ logs(); }
      else if(cmd === 'decrypt'){ await decrypt(args.join('')); }
      else if(cmd === 'access' && args[0] && args[0].toLowerCase() === 'database'){ await accessDatabase(args); }
      else if(full === 'whoami'){ whoami(); }
      else if(full === 'clear' || full === 'cls'){ clearScreen(); }
      else if(full === 'history'){ historyCmd(); }
      else if(full === 'sudo' || full === 'sudo su'){ sudo(); }
      else if(full === 'matrix'){ matrixRain(); }
      else if(full === 'coffee'){ coffee(); }
      else if(full === 'hack nasa'){ hackNasa(); }
      else if(full === 'rm -rf /'){ rmrf(); }
      else if(cmd === 'connect'){ connect(args[0]); }
      else if(full === 'ping'){ ping(); }
      else if(full === 'uname' || full === 'uname -a'){ uname(); }
      else if(full === 'date'){ dateCmd(); }
      else if(full === 'credits'){ credits(); }
      else if(full === 'exit' || full === 'logout' || full === 'quit'){ await exitSession(); }
      else { unknown(parts[0]); }
    } finally {
      setBusy(false);
      addBlank();
      input.focus();
    }
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // ---------- INPUT HANDLING ----------
  input.addEventListener('keydown', (e) => {
    if(state.busy) { e.preventDefault(); return; }
    if(e.key === 'Enter'){
      const val = input.value;
      input.value = '';
      runCommand(val);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(state.history.length === 0) return;
      state.historyIndex = Math.max(0, state.historyIndex - 1);
      input.value = state.history[state.historyIndex] || '';
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      state.historyIndex = Math.min(state.history.length, state.historyIndex + 1);
      input.value = state.history[state.historyIndex] || '';
    } else if(e.key === 'Tab'){
      e.preventDefault();
      const val = input.value.toLowerCase();
      if(!val) return;
      const match = KNOWN_COMMANDS.find(c => c.startsWith(val));
      if(match) input.value = match + ' ';
    }
  });

  document.querySelector('.crt').addEventListener('click', () => input.focus());

  boot();
})();
</script>
